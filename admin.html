<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mission Control — AstroQuest</title>
<link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/account.css"><link rel="stylesheet" href="css/aq.css"><link rel="stylesheet" href="css/chatbot.css">
<style>.acct-body{display:block}.acct-card input[type=checkbox]{width:auto;padding:0}.lb-table{font-size:0.74rem}</style>
</head><body class="acct-body">
<script src="js/seed-data.js"></script><script src="js/mock-api.js"></script><script src="js/aq-common.js"></script>
<header class="acct-header"><a class="logo" href="index.html" style="font-family:Orbitron;color:var(--accent);text-decoration:none;font-size:1rem;letter-spacing:2px">Astro<span style="color:var(--accent2)">Quest</span></a>
<nav class="acct-nav" aria-label="Account" id="acctNav"><a href="index.html">← Back to Space</a></nav></header>
<main class="acct-main"><div class="acct-stack"><div id="adm" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:0.8rem"></div></div></main>
<script>(function(){if(AQ.auth&&AQ.admin){document.getElementById('acctNav').insertAdjacentHTML('afterbegin','<a href="'+aqHref('admin.html')+'">Mission Control</a><a href="'+aqHref('admin.html')+'#users">Users</a><a href="'+aqHref('admin.html')+'#questions">Quiz questions</a>')}})();</script>
<script>
(function(){var me=AQMock.me();var root=document.getElementById('adm');
if(!me.auth||!me.admin){root.innerHTML='<div class="acct-card"><h1>Access denied</h1><p class="acct-sub">This area is restricted to Mission Control.</p><a class="acct-btn" href="'+aqHref('index.html')+'">Return to Earth</a></div>';return}
var d=function(s){return new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function tabs(cur){return '<div class="adm-links" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.4rem">'+[['','Dashboard'],['users','Users'],['questions','Quiz questions']].map(function(t){return '<button type="button" class="adm-btn'+(t[0]===cur?' on':'')+'" data-t="'+t[0]+'" style="'+(t[0]===cur?'border-color:var(--accent);color:var(--accent)':'')+'">'+t[1]+'</button>'}).join('')+'</div>'}
function dash(){var s=AQMock.admin.dashboard();return '<div class="acct-card xwide">'+tabs('')+'<h1>Mission Control</h1><p class="acct-sub">Manage astronauts and quiz content.</p><div class="adm-status-row"><span class="adm-status ok">Database: browser storage (frontend-only build)</span><span class="adm-status warn">AI guide: offline demo mode</span></div>'+
'<div class="adm-stats"><div class="stat"><div class="v">'+s.users+'</div><div class="l">Astronauts ('+s.admins+' admin)</div></div><div class="stat"><div class="v">'+s.active+'/'+s.questions+'</div><div class="l">Quiz questions live</div></div><div class="stat"><div class="v">'+s.quizAttempts+'</div><div class="l">Quiz attempts</div></div><div class="stat"><div class="v">'+s.missions+'</div><div class="l">Moon missions</div></div><div class="stat"><div class="v">'+s.planets+'</div><div class="l">Worlds in database</div></div></div>'+
'<h2>Newest astronauts</h2><div class="adm-table-wrap"><table class="lb-table"><tr><th>Name</th><th>Email</th><th>Rank</th><th>Joined</th></tr>'+s.newest.map(function(u){return '<tr><td>'+esc(u.displayName)+(u.isAdmin?' <span class="chip">Admin</span>':'')+'</td><td>'+esc(u.email)+'</td><td>'+u.rank+' ('+u.xp+' XP)</td><td>'+d(u.joinedAt)+'</td></tr>'}).join('')+'</table></div>'+
'<p class="acct-sub" style="margin-top:1rem"><button type="button" class="adm-btn" id="resetDb">Reset demo data</button> clears all local accounts, scores and question edits.</p></div>'}
function users(){var L=AQMock.admin.users();return '<div class="acct-card xwide">'+tabs('users')+'<h1>Astronauts</h1><div class="adm-table-wrap"><table class="lb-table"><tr><th>Name</th><th>Email</th><th>Rank</th><th>Joined</th><th>Status</th><th>Actions</th></tr>'+L.map(function(u){return '<tr><td>'+esc(u.displayName)+'</td><td>'+esc(u.email)+'</td><td>'+u.rank+' ('+u.xp+' XP)</td><td>'+d(u.joinedAt)+'</td><td>'+(u.isAdmin?'<span class="chip">Admin</span> ':'')+(u.isLocked?'<span class="chip" style="border-color:var(--danger)">Locked</span>':'')+'</td><td>'+(u.id===me.id?'<span class="acct-sub">you</span>':'<button type="button" class="adm-btn" data-a="admin" data-id="'+u.id+'">'+(u.isAdmin?'Remove admin':'Make admin')+'</button><button type="button" class="adm-btn" data-a="lock" data-id="'+u.id+'">'+(u.isLocked?'Unlock':'Lock')+'</button>')+'</td></tr>'}).join('')+'</table></div></div>'}
function questions(){var L=AQMock.admin.questions();return '<div class="acct-card xwide">'+tabs('questions')+'<h1>Quiz questions</h1><p class="acct-sub">'+L.filter(function(q){return q.isActive}).length+' live of '+L.length+'. <button type="button" class="adm-btn" data-a="new">+ Add question</button></p><div class="adm-table-wrap"><table class="lb-table"><tr><th>#</th><th>Topic</th><th>Question</th><th>Correct</th><th>Live</th><th>Actions</th></tr>'+L.map(function(q){return '<tr'+(q.isActive?'':' style="opacity:0.5"')+'><td>'+q.id+'</td><td>'+esc(q.topic)+'</td><td>'+esc(q.text)+'</td><td>'+esc(q.options[q.correctIndex]||'')+'</td><td>'+(q.isActive?'✓':'hidden')+'</td><td><button type="button" class="adm-btn" data-a="edit" data-id="'+q.id+'">Edit</button><button type="button" class="adm-btn" data-a="hide" data-id="'+q.id+'">'+(q.isActive?'Hide':'Show')+'</button><button type="button" class="adm-btn" data-a="del" data-id="'+q.id+'">Delete</button></td></tr>'}).join('')+'</table></div></div>'}
function form(q){q=q||{id:0,text:'',topic:'General',options:['','','',''],correctIndex:0,explanation:'',isActive:true};var o=function(i){return esc(q.options[i]||'')};
return '<div class="acct-card wide">'+tabs('questions')+'<h1>'+(q.id?'Edit question #'+q.id:'New question')+'</h1><form id="qf"><div class="acct-error" id="qerr"></div><label>Question</label><input id="qt" maxlength="300" value="'+esc(q.text)+'" required><label>Topic</label><input id="qtop" maxlength="30" value="'+esc(q.topic)+'" required>'+
['A','B','C','D'].map(function(L,i){return '<label><input type="radio" name="ci" value="'+i+'"'+(q.correctIndex===i?' checked':'')+'> Answer '+L+' (tick = correct)</label><input id="o'+i+'" maxlength="150" value="'+o(i)+'" required>'}).join('')+
'<label>Explanation</label><textarea id="qex" maxlength="600" rows="3">'+esc(q.explanation)+'</textarea><label class="acct-check"><input type="checkbox" id="qact"'+(q.isActive?' checked':'')+'> Show in the quiz</label><button type="submit" class="acct-btn">Save</button><button type="button" class="acct-btn secondary" data-a="cancel">Cancel</button></form></div>'}
var view=location.hash.replace('#','')||window.AQ_SUBHASH||'';var editing=null;
function render(){root.innerHTML=editing!==null?form(editing):view==='users'?users():view==='questions'?questions():dash();
var qf=document.getElementById('qf');if(qf)qf.onsubmit=function(e){e.preventDefault();var g=function(i){return document.getElementById(i).value.trim()};var opts=[0,1,2,3].map(function(i){return g('o'+i)});var ci=document.querySelector('input[name=ci]:checked');
if(!ci){document.getElementById('qerr').textContent='Choose which answer is correct.';return}
AQMock.admin.saveQuestion({id:editing.id||0,text:g('qt'),topic:g('qtop')||'General',options:opts,correctIndex:+ci.value,explanation:g('qex'),isActive:document.getElementById('qact').checked});editing=null;render()};
var rb=document.getElementById('resetDb');if(rb)rb.onclick=function(){if(confirm('Reset all demo data?')){AQMock.reset();aqGo('index.html')}}}
root.onclick=function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
if(b.dataset.t!==undefined){view=b.dataset.t;editing=null;render();return}
if(a==='admin')AQMock.admin.toggleAdmin(id);else if(a==='lock')AQMock.admin.toggleLock(id);else if(a==='hide')AQMock.admin.toggleQuestion(+id);else if(a==='del'){if(confirm('Delete this question?'))AQMock.admin.deleteQuestion(+id)}
else if(a==='new'){editing={};}else if(a==='edit'){editing=JSON.parse(JSON.stringify(AQMock.admin.questions().find(function(q){return q.id===+id})))}else if(a==='cancel'){editing=null}
if(a)render()};
render()})();</script>
<script src="js/chatbot.js"></script>
</body></html>
